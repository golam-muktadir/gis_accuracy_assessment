<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Accuracy Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Login Screen (Hidden once logged in) -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900 bg-opacity-80 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl text-center">
            <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">GIS Interactive Portal</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-4">Welcome, Experts!</h2>
            <p class="text-slate-600 text-sm mt-2">Enter your full name to access the study modules, quizzes, and live leaderboard.</p>
            <form id="login-form" class="mt-6 space-y-4">
                <input type="text" id="student-name" required placeholder="Enter your full name..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-center font-medium">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition duration-200">Start Learning ➔</button>
            </form>
        </div>
    </div>

    <!-- Main Application Wrapper -->
    <div id="app-container" class="flex flex-col min-h-screen hidden">
        <!-- Top Navigation Bar -->
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-emerald-400 font-bold text-xl">🌐 GIS SISS</span>
                    <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">Accuracy Assessment</span>
                </div>
                <!-- Dynamic Navigation Tabs (Generated from content.js) -->
                <nav id="nav-tabs" class="flex flex-wrap justify-center gap-2"></nav>
                <div class="flex items-center gap-3 bg-slate-800 px-3 py-1.5 rounded-xl">
                    <span class="text-xs text-slate-400">Student:</span>
                    <span id="display-student-name" class="text-sm font-bold text-emerald-400"></span>
                    <button onclick="logout()" class="text-xs text-red-400 hover:underline ml-2">Switch</button>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="max-w-5xl mx-auto px-6 py-10 w-full flex-grow" id="main-content">
            <!-- Content gets dynamically injected here -->
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
            <p>Department of Geography and Planning • The University of Toledo</p>
        </footer>
    </div>

    <script src="content.js"></script>
    <script src="app.js"></script>
</body>
</html>
