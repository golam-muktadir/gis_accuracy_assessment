<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Accuracy Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between text-base">

    <!-- Login Screen -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900 bg-opacity-80 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl text-center">
            <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">GIS Accuracy Assessment Learning</span>
            <h2 class="text-3xl font-extrabold text-slate-900 mt-4">Welcome, Experts!</h2>
            <p class="text-slate-600 text-base mt-2">Enter your name to access.</p>
            <form id="login-form" class="mt-6 space-y-4">
                <input type="text" id="student-name" required placeholder="Enter your full name..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-center font-medium text-lg">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition duration-200 text-lg shadow-lg">Start Learning ➔</button>
            </form>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="flex flex-col min-h-screen hidden">
        <!-- Top Header & Navigation -->
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40 py-5 px-6">
            <div class="max-w-7xl mx-auto flex flex-col items-center gap-4">
                
                <!-- Centered Main Title -->
                <div class="text-center">
                    <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-400 tracking-tight">
                        GIS Accuracy Assessment
                    </h1>
                </div>

                <!-- Navigation Tabs & Live User Info Bar -->
                <div class="w-full flex flex-col md:flex-row justify-between items-center gap-4 border-t border-slate-800 pt-4">
                    <nav id="nav-tabs" class="flex flex-wrap justify-center gap-2"></nav>
                    
                    <div class="flex items-center gap-4 bg-slate-800 px-4 py-2 rounded-xl shadow-inner text-sm">
                        <div>
                            <span class="text-slate-400">Student:</span> <span id="display-student-name" class="font-bold text-emerald-400"></span>
                        </div>
                        <div class="border-l border-slate-700 pl-4">
                            <span class="text-slate-400">Score:</span> <span id="live-score" class="font-bold text-yellow-400">0 pts</span>
                        </div>
                        <div class="border-l border-slate-700 pl-4">
                            <span class="text-slate-400">Rank:</span> <span id="live-rank" class="font-bold text-blue-400">--</span>
                        </div>
                        <button onclick="logout()" class="text-xs text-red-400 hover:underline ml-2 bg-slate-900 px-2 py-1 rounded">Logout</button>
                    </div>
                </div>

            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="max-w-6xl mx-auto px-6 py-10 w-full flex-grow" id="main-content"></main>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
            <p>Department of Geography and Planning • University of Toledo</p>
        </footer>
    </div>

    <!-- Modular Content Files -->
    <script src="understanding.js"></script>
    <script src="process.js"></script>
    <script src="sampling.js"></script>
    <script src="calculation.js"></script>
    <script src="reflection.js"></script>

    <!-- Core Engine -->
    <script src="app.js"></script>
</body>
</html>
